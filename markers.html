<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>EcoLens markers</title>
<style>
  body{font-family:system-ui,sans-serif;margin:20px;color:#10261a;background:#f8faf8;text-align:center}
  h1{font-size:22px;margin:0 0 6px} p{margin:0 auto 16px;max-width:60ch;line-height:1.45;color:#395243}
  .sheet{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
  figure{margin:0;break-inside:avoid;display:flex;flex-direction:column;align-items:center;background:#fff;padding:16px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,0.06);border:1px solid #e1e8e2}
  figure svg{width:min(10cm, 80vw);height:min(10cm, 80vw);display:block;image-rendering:pixelated}
  figcaption{font-size:16px;font-weight:600;margin-top:12px;color:#10261a}
  @media print{body{background:#fff;margin:0;text-align:left} p.noprint{display:none} figure{border:none;box-shadow:none;padding:0;page-break-inside:avoid} figure svg{width:10cm;height:10cm}}
</style></head><body>
<h1>EcoLens world markers</h1>
<p class="noprint">Hold your phone up to your webcam, or print at 100% scale. Keep the white border intact for tracking.</p>
<div class="sheet" id="sheet"></div>
<script type="module" src="/src/markers.js"></script>
</body></html>
