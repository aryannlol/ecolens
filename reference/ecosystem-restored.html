<body>

  <button onclick="EcoEndgame.show({to:'recovering'})">Polluted &rarr; Recovering</button>
  <button onclick="EcoEndgame.show({to:'clean'})">Recovering &rarr; Clean</button>
  <button onclick="EcoEndgame.show({to:'final'})">Final: Thriving</button>

        g.gain.setValueAtTime(0.0001, t0 + i * 0.11); g.gain.exponentialRampToValueAtTime(0.12, t0 + i * 0.11 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.11 + 1.3);
        o.connect(g); g.connect(aud.destination); o.start(t0 + i * 0.11); o.stop(t0 + i * 0.11 + 1.4);
      });
    } catch (e) { /* audio is optional */ }
  }

  function play(o) {
    root.classList.remove('play'); void root.offsetWidth; root.classList.add('play');
    seed(); start = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
    if (!o || o.sound !== false) chime();
    setTimeout(function () { var b = root.querySelector('.ee-next'); if (b) b.focus({ preventScroll: true }); }, 4300);
  }

  function show(o) {
    ensure(); o = o || {}; cb = { last: o, next: o.onNext, replay: o.onReplay, close: o.onClose };
    pill.style.display = 'none';
    build(CFG[o.to] || CFG.recovering);
    root.classList.add('on'); play(o);
  }
  function stop() { cancelAnimationFrame(raf); if (root) root.classList.remove('on', 'play'); }
  function hide() { stop(); if (cb.close) cb.close(); }
  function next() { stop(); if (cb.next) cb.next(); }
  function replay() { if (cb.replay) cb.replay(); play(cb.last); }
  function inspect() { stop(); pill.style.display = 'block'; }

  window.EcoEndgame = { show: show, hide: hide };
})();

// Plays automatically on open. Enter = next, R = replay, Esc = close.
window.addEventListener('load', function () { EcoEndgame.show({ to: 'recovering' }); });
